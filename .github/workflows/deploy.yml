# Compila, valida y publica Funkade en GitHub Pages.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'incoming/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - name: Validar mods publicados
        id: validate
        run: |
          python3 tools/mod-importer/validate_mods.py --markdown mod-validation.md --json mod-validation.json
          cat mod-validation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar informe de validación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funkade-mod-validation
          path: |
            mod-validation.md
            mod-validation.json
          if-no-files-found: ignore
          retention-days: 14
      - run: bun install
      - name: Comprobar tipos
        run: bunx tsc --noEmit
      - name: Tests unitarios
        run: bun test tests/unit
      - name: Regenerar catálogo (por si se editó algún manifest.json)
        run: bun tools/build-catalog.ts
      - name: Compilar
        run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
